# Usage (from the repository root):
#   docker compose build
#   docker compose run --rm tests          # works on any OS, no camera needed
#   xhost +local:docker                    # Linux only, once per login
#   docker compose --profile gui run --rm trainer    # training tool (Linux host with camera + mic)
#
# See DOCKER.md for the full instructions and the Windows / WSL notes.

services:
  # Headless check that the environment is correct: the project's own automated tests.
  tests:
    build: .
    image: volleyball-officiating:latest
    # xvfb-run gives the tests a virtual screen (Match Testing opens an OpenCV window).
    # Xvfb is started directly (xvfb-run hung inside Docker Desktop).
    command:
      - sh
      - -c
      - >-
        Xvfb :99 -screen 0 1280x720x24 -nolisten tcp &
        sleep 3 &&
        DISPLAY=:99 python tests/test_trainer_smoke.py &&
        DISPLAY=:99 python tests/test_gesture_grader.py

  # Long-running container so `docker ps` shows the system as installed and running.
  #   docker compose up -d app
  #   docker ps
  #   docker exec volleyball-officiating python tests/test_gesture_grader.py
  # (the smoke test needs the virtual screen, so for it use: docker compose run --rm tests)
  app:
    build: .
    image: volleyball-officiating:latest
    container_name: volleyball-officiating
    restart: unless-stopped
    command: sleep infinity
    volumes:
      - ./data:/app/data

  # The training tool (window on the host's screen, host camera and microphone).
  # Behind a profile so `docker compose run tests` never needs a camera or X server.
  trainer:
    profiles: ["gui"]
    build: .
    image: volleyball-officiating:latest
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./data:/app/data            # sessions, consent records, settings stay on the host
    devices:
      - /dev/video0:/dev/video0     # camera  (check yours with: ls /dev/video*)
      - /dev/snd:/dev/snd           # microphone / sound card
    command: python main.py

  # The original live officiating system (same image, different command).
  live:
    profiles: ["gui"]
    build: .
    image: volleyball-officiating:latest
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./data:/app/data
    devices:
      - /dev/video0:/dev/video0
      - /dev/snd:/dev/snd
    command: python main.py live